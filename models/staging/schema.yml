version: 2

models:
  - name: stg_airbnb
    description: "Airbnb raw to clean staging (month-grain via date_id)."
    columns:
      - name: listing_id
        tests: [not_null]
      - name: host_id
        tests: [not_null]
      - name: date_id
        tests: [not_null]
      - name: suburb
        tests:
          - not_null:
              severity: warn
      - name: price
        tests:
          - not_null:
              severity: warn
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [listing_id, date_id]
          config:
            severity: warn

  - name: stg_census_g01
    description: "ABS 2016 G01: population and age structure with proportions."
    columns:
      - name: lga_code
        tests: [not_null, unique]
      - name: total_persons
        tests:
          - not_null:
              severity: warn

  - name: stg_census_g02
    description: "ABS 2016 G02: medians & averages (age, mortgage, rent, income, household size)."
    columns:
      - name: lga_code
        tests: [not_null, unique]
      - name: median_mortgage_monthly
        tests:
          - not_null:
              severity: warn

  - name: stg_lga_code
    description: "LGA code-name mapping."
    columns:
      - name: lga_code
        tests: [not_null, unique]
      - name: lga_name
        tests:
          - not_null:
              severity: warn

  - name: stg_lga_suburb
    description: "Mapping from suburb to LGA code (normalized join)."
    columns:
      - name: suburb
        tests: [not_null]
      - name: lga_code
        tests:
          - not_null
          - relationships:
              to: ref('stg_lga_code')
              field: lga_code
